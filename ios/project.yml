# Le projet Xcode est généré par XcodeGen sur le runner macOS (rien à compiler sous Windows).
name: PrayerCounter
options:
  bundleIdPrefix: cmfi
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
    SWIFT_VERSION: "5.0"
targets:
  PrayerCounter:
    type: application
    platform: iOS
    sources:
      - PrayerCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cmfi.prayercounter.org
        PRODUCT_NAME: PrayerCounter
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PrayerCounter/Info.plist
      properties:
        CFBundleDisplayName: Prayer Proclamation
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  PrayerCounter:
    build:
      targets:
        PrayerCounter: all
    archive:
      config: Release
